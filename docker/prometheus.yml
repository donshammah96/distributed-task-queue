global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "dtq-api-server"
    static_configs:
      - targets: ["host.docker.internal:4000"]
    metrics_path: /metrics

  - job_name: "dtq-worker-node"
    static_configs:
      - targets: ["host.docker.internal:4001"]
    metrics_path: /metrics
